<sly data-sly-use.faq="com.smartbank.core.models.FaqAccordionModel"/>

<section id="${faq.id}" class="cmp-accordion cmp-accordion--custom"
    aria-labelledby="${faq.id}-heading">
    <h2 class="cmp-accordion__heading" id="${faq.id}-heading">${faq.heading}</h2>
    <p class="cmp-accordion__description" data-sly-test="${faq.description}">
        ${faq.description}
    </p>

    <div class="cmp-accordion__items" data-sly-list.item="${faq.items}">
        <details class="cmp-accordion__item" id="${faq.id}-item-${itemList.index}">
            <summary class="cmp-accordion__button"
                aria-controls="${faq.id}-panel-${itemList.index}">
                <span class="cmp-accordion__title">${item.question}</span>
                <span class="cmp-accordion__icon" aria-hidden="true"></span>
            </summary>
            <div class="cmp-accordion__panel" id="${faq.id}-panel-${itemList.index}">
                <p>${item.answer}</p>
            </div>
        </details>
    </div>
</section>
